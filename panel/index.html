<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vstack Workflow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--background);
      --fg: var(--foreground);
      --muted: var(--muted-foreground);
      --border: var(--border);
      --card: var(--card);
      --primary: var(--primary);
      --primary-fg: var(--primary-foreground);
      --muted-fg: var(--muted-foreground);
      --destructive: var(--destructive);
      --warning: var(--warning);
      --success: var(--success);
      --info: var(--info);
      --radius: var(--radius);
      --font-sans: var(--font-sans, system-ui, sans-serif);
      --font-mono: var(--font-mono, monospace);
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 0.875rem;
      line-height: 1.5;
      min-height: 100vh;
      padding: 0.75rem;
    }
    .panel { display: flex; flex-direction: column; gap: 0.75rem; height: 100%; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 0.875rem; font-weight: 600; }
    .refresh-btn { padding: 0.25rem 0.5rem; font-size: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); cursor: pointer; }
    .refresh-btn:hover { background: var(--muted); }
    .status-badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; }
    .status-idle { background: var(--muted); color: var(--muted-fg); }
    .status-proposed { background: var(--info); color: var(--info-fg); }
    .status-planning { background: var(--info); color: var(--info-fg); }
    .status-ready { background: var(--success); color: var(--success-fg); }
    .status-active { background: var(--primary); color: var(--primary-fg); }
    .status-blocked { background: var(--warning); color: var(--warning-fg); }
    .status-verifying { background: var(--primary); color: var(--primary-fg); }
    .status-completed { background: var(--success); color: var(--success-fg); }
    .status-failed { background: var(--destructive); color: var(--destructive-fg); }
    .status-cancelled { background: var(--muted); color: var(--muted-fg); }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { padding: 0.375rem 0.75rem; font-size: 0.75rem; font-weight: 500; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .tab:hover { color: var(--fg); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; flex: 1; overflow-y: auto; min-height: 0; }
    .tab-panel.active { display: block; }
    .section { margin-bottom: 1rem; }
    .section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.5rem; }
    .info-row { display: flex; justify-content: space-between; padding: 0.375rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); }
    .info-value { font-family: var(--font-mono); font-size: 0.75rem; text-align: right; max-width: 60%; word-break: break-all; }
    .progress-bar { height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; margin-top: 0.5rem; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }
    .empty-state { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; }
    .error-state { padding: 1rem; background: color-mix(in srgb, var(--destructive) 15%, transparent); border: 1px solid var(--destructive); border-radius: var(--radius); color: var(--destructive-fg); font-size: 0.8rem; }
    .delivery-item { padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.5rem; cursor: pointer; }
    .delivery-item:hover { background: var(--card); }
    .delivery-item.selected { border-color: var(--primary); }
    .delivery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
    .delivery-title { font-weight: 500; font-size: 0.875rem; }
    .delivery-status { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; }
    .status-proposed { background: var(--info); color: var(--info-fg); }
    .status-active { background: var(--primary); color: var(--primary-fg); }
    .status-blocked { background: var(--warning); color: var(--warning-fg); }
    .status-completed { background: var(--success); color: var(--success-fg); }
    .status-cancelled { background: var(--muted); color: var(--muted-fg); }
    .status-failed { background: var(--destructive); color: var(--destructive-fg); }
    .delivery-meta { display: flex; gap: 1rem; font-size: 0.75rem; color: var(--muted); }
    .delivery-meta span { font-size: 0.7rem; }
    .detail-section { margin-bottom: 1rem; padding: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .detail-section h3 { font-size: 0.875rem; margin-bottom: 0.5rem; color: var(--fg); }
    .detail-section h4 { font-size: 0.8rem; margin: 0.5rem 0 0.25rem; color: var(--muted); }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.8rem; color: var(--fg); }
    .detail-meta span { min-width: 150px; }
    .detail-section ul { margin-left: 1.5rem; margin-top: 0.25rem; }
    .detail-section li { margin-bottom: 0.25rem; font-size: 0.85rem; }
    .gate-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .gate-table th, .gate-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    .gate-table th { font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .status-passed { color: var(--success); }
    .status-failed { color: var(--destructive); }
    .status-pending { color: var(--warning); }
    .status-skipped { color: var(--muted); }
    .status-error { color: var(--destructive); }
    .blocked { color: var(--warning); font-weight: 500; }
    .sub-tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; overflow-x: auto; }
    .sub-tab { padding: 0.375rem 0.75rem; font-size: 0.75rem; font-weight: 500; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .sub-tab:hover { color: var(--fg); }
    .sub-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .sub-tab-panel { display: none; }
    .sub-tab-panel.active { display: block; }
    .phases-table, .tasks-table, .agents-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .phases-table th, .phases-table td, .tasks-table th, .tasks-table td, .agents-table th, .agents-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    .phases-table th, .tasks-table th, .agents-table th { font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .phase-row.status-active td, .task-row.status-in_progress td, .task-row.status-assigned td { background: color-mix(in srgb, var(--primary) 5%, transparent); }
    .phase-row.status-completed td, .task-row.status-completed td { background: color-mix(in srgb, var(--success) 5%, transparent); }
    .phase-row.status-blocked td, .task-row.status-blocked td { background: color-mix(in srgb, var(--warning) 5%, transparent); }
    .phase-row.status-failed td, .task-row.status-failed td { background: color-mix(in srgb, var(--destructive) 5%, transparent); }
    .type-badge { padding: 0.125rem 0.375rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; text-transform: uppercase; }
    .type-feature { background: var(--info); color: var(--info-fg); }
    .type-bugfix { background: var(--warning); color: var(--warning-fg); }
    .type-refactor { background: var(--primary); color: var(--primary-fg); }
    .type-migration { background: var(--destructive); color: var(--destructive-fg); }
    .type-infrastructure { background: var(--success); color: var(--success-fg); }
    .type-documentation { background: var(--muted); color: var(--muted-fg); }
    .type-operations { background: var(--primary); color: var(--primary-fg); }
    .type-release { background: var(--success); color: var(--success-fg); }
    .type-other { background: var(--muted); color: var(--muted-fg); }
    .priority-badge { padding: 0.125rem 0.375rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; text-transform: uppercase; }
    .priority-low { background: var(--muted); color: var(--muted-fg); }
    .priority-medium { background: var(--info); color: var(--info-fg); }
    .priority-high { background: var(--warning); color: var(--warning-fg); }
    .priority-critical { background: var(--destructive); color: var(--destructive-fg); }

  </style>
</head>
<body>
  <div class="panel">
    <header class="header">
      <h1>vstack Workflow</h1>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span id="statusBadge" class="status-badge status-idle">Idle</span>
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
      </div>
    </header>
    
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-tab="deliveries" aria-selected="false">Deliveries</button>
      <button class="tab" role="tab" data-tab="delivery-detail" aria-selected="false">Delivery Detail</button>
      <button class="tab" role="tab" data-tab="tasks" aria-selected="false">Tasks</button>
      <button class="tab" role="tab" data-tab="quality" aria-selected="false">Quality</button>
      <button class="tab" role="tab" data-tab="reviews" aria-selected="false">Reviews</button>
      <button class="tab" role="tab" data-tab="releases" aria-selected="false">Releases</button>
      <button class="tab" role="tab" data-tab="evidence" aria-selected="false">Evidence</button>
    </nav>
    
    <section class="tab-panel active" id="panel-overview" role="tabpanel">
      <div class="section">
        <div class="section-title">Workflow</div>
        <div class="info-row"><span class="info-label">Goal</span><span class="info-value" id="goal">-</span></div>
        <div class="info-row"><span class="info-label">Status</span><span class="info-value" id="status">-</span></div>
        <div class="info-row"><span class="info-label">Current Step</span><span class="info-value" id="currentStep">-</span></div>
        <div class="info-row"><span class="info-label">Active Task</span><span class="info-value" id="activeTask">-</span></div>
        <div class="info-row"><span class="info-label">Next Action</span><span class="info-value" id="nextAction">-</span></div>
        <div class="info-row"><span class="info-label">Progress</span>
          <span class="info-value">
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
            <span id="progressText">0/0</span>
          </span>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Last Updated</div>
        <div id="lastUpdated" style="font-family: var(--font-mono); font-size: 0.75rem;">Last updated: never</div>
      </div>
    </section>
    
    <section class="tab-panel" id="panel-deliveries" role="tabpanel">
      <div class="section">
        <div class="section-title">Deliveries</div>
        <div id="deliveriesList" class="deliveries-list"></div>
      </div>
    </section>
    
    <section class="tab-panel" id="panel-delivery-detail" role="tabpanel">
      <div id="deliveryDetail"></div>
    </section>
    
    <section class="tab-panel" id="panel-tasks" role="tabpanel">
      <div class="section">
        <div class="section-title">Tasks</div>
        <div id="tasksList" class="tasks-list"></div>
      </div>
    </section>
    
    <section class="tab-panel" id="panel-quality" role="tabpanel">
      <div id="qualityContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-reviews" role="tabpanel">
      <div id="reviewsContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-releases" role="tabpanel">
      <div id="releasesContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-evidence" role="tabpanel">
      <div id="evidenceContent"></div>
    </section>
    
    <div class="last-refresh" id="lastRefresh">Last refreshed: never</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
