<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vstack Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--background);
      --fg: var(--foreground);
      --muted: var(--muted-foreground);
      --border: var(--border);
      --card: var(--card);
      --primary: var(--primary);
      --primary-fg: var(--primary-foreground);
      --muted-fg: var(--muted-foreground);
      --destructive: var(--destructive);
      --warning: var(--warning);
      --success: var(--success);
      --info: var(--info);
      --radius: var(--radius);
      --font-sans: var(--font-sans, system-ui, sans-serif);
      --font-mono: var(--font-mono, monospace);
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 0.875rem;
      line-height: 1.5;
      min-height: 100vh;
      padding: 1rem;
    }
    .dashboard { display: flex; flex-direction: column; gap: 1rem; max-width: 1400px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .controls { display: flex; gap: 0.5rem; align-items: center; }
    .refresh-btn { padding: 0.375rem 0.75rem; font-size: 0.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); cursor: pointer; }
    .refresh-btn:hover { background: var(--muted); }
    .delivery-select { padding: 0.375rem 0.75rem; font-size: 0.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); }
    .status-badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; }
    .status-idle { background: var(--muted); color: var(--muted-fg); }
    .status-proposed { background: var(--info); color: var(--info-fg); }
    .status-active { background: var(--primary); color: var(--primary-fg); }
    .status-blocked { background: var(--warning); color: var(--warning-fg); }
    .status-completed { background: var(--success); color: var(--success-fg); }
    .status-failed { background: var(--destructive); color: var(--destructive-fg); }
    .status-cancelled { background: var(--muted); color: var(--muted-fg); }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); overflow-x: auto; margin-bottom: 1rem; }
    .tab { padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 500; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .tab:hover { color: var(--fg); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; flex: 1; overflow-y: auto; }
    .tab-panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .card h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--fg); }
    .stat-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--muted); font-size: 0.8rem; }
    .stat-value { font-family: var(--font-mono); font-weight: 600; font-size: 0.875rem; }
    .stat-value.passed { color: var(--success); }
    .stat-value.failed { color: var(--destructive); }
    .stat-value.warning { color: var(--warning); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .badge { padding: 0.125rem 0.375rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; background: var(--muted); color: var(--muted-fg); }
    .type-badge { padding: 0.125rem 0.375rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; text-transform: uppercase; }
    .type-feature { background: var(--info); color: var(--info-fg); }
    .type-bugfix { background: var(--warning); color: var(--warning-fg); }
    .type-refactor { background: var(--primary); color: var(--primary-fg); }
    .type-migration { background: var(--destructive); color: var(--destructive-fg); }
    .type-infrastructure { background: var(--success); color: var(--success-fg); }
    .type-documentation { background: var(--muted); color: var(--muted-fg); }
    .type-operations { background: var(--primary); color: var(--primary-fg); }
    .type-release { background: var(--success); color: var(--success-fg); }
    .type-other { background: var(--muted); color: var(--muted-fg); }
    .priority-badge { padding: 0.125rem 0.375rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 500; text-transform: uppercase; }
    .priority-low { background: var(--muted); color: var(--muted-fg); }
    .priority-medium { background: var(--info); color: var(--info-fg); }
    .priority-high { background: var(--warning); color: var(--warning-fg); }
    .priority-critical { background: var(--destructive); color: var(--destructive-fg); }
    .status-badge-cell { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; }
    .status-proposed { background: var(--info); color: var(--info-fg); }
    .status-active { background: var(--primary); color: var(--primary-fg); }
    .status-blocked { background: var(--warning); color: var(--warning-fg); }
    .status-completed { background: var(--success); color: var(--success-fg); }
    .status-cancelled { background: var(--muted); color: var(--muted-fg); }
    .status-failed { background: var(--destructive); color: var(--destructive-fg); }
    .status-pending { background: var(--warning); color: var(--warning-fg); }
    .status-running { background: var(--primary); color: var(--primary-fg); }
    .status-dispatched { background: var(--info); color: var(--info-fg); }
    .status-ready { background: var(--success); color: var(--success-fg); }
    .status-in_progress { background: var(--primary); color: var(--primary-fg); }
    .status-review { background: var(--info); color: var(--info-fg); }
    .status-not_started { background: var(--muted); color: var(--muted-fg); }
    .status-verifying { background: var(--primary); color: var(--primary-fg); }
    .status-skipped { background: var(--muted); color: var(--muted-fg); }
    .status-needs_rework { background: var(--warning); color: var(--warning-fg); }
    .status-approved { background: var(--success); color: var(--success-fg); }
    .status-rejected { background: var(--destructive); color: var(--destructive-fg); }
    .status-expired { background: var(--muted); color: var(--muted-fg); }
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
    .error-state { padding: 1rem; background: color-mix(in srgb, var(--destructive) 15%, transparent); border: 1px solid var(--destructive); border-radius: var(--radius); color: var(--destructive-fg); font-size: 0.8rem; }
    .quality-stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat { flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
    .stat-value { display: block; font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .check-group, .severity-group, .evidence-source-group { margin-bottom: 1.5rem; }
    .check-group h4, .severity-group h5, .evidence-source-group h4 { margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .release-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
    .release-card.status-draft { border-left: 4px solid var(--muted); }
    .release-card.status-ready { border-left: 4px solid var(--success); }
    .release-card.status-published { border-left: 4px solid var(--primary); }
    .release-card.status-failed { border-left: 4px solid var(--destructive); }
    .release-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .release-header h5 { font-size: 0.875rem; }
    .release-meta { display: flex; gap: 1rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
    .changelog { font-size: 0.8rem; line-height: 1.6; color: var(--fg); }
    .changelog ul { margin-left: 1.5rem; }
    .last-refresh { font-size: 0.75rem; color: var(--muted); text-align: right; padding-top: 0.5rem; border-top: 1px solid var(--border); }
    code { font-family: var(--font-mono); font-size: 0.75rem; background: var(--muted); padding: 0.125rem 0.25rem; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <h1>vstack Dashboard</h1>
      <div class="controls">
        <select class="delivery-select" id="deliverySelect" disabled>
          <option value="">Select delivery...</option>
        </select>
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
      </div>
    </header>
    
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-tab="quality" aria-selected="false">Quality</button>
      <button class="tab" role="tab" data-tab="reviews" aria-selected="false">Reviews</button>
      <button class="tab" role="tab" data-tab="releases" aria-selected="false">Releases</button>
      <button class="tab" role="tab" data-tab="evidence" aria-selected="false">Evidence</button>
    </nav>
    
    <section class="tab-panel active" id="panel-overview" role="tabpanel">
      <div class="grid" id="overviewGrid"></div>
    </section>
    
    <section class="tab-panel" id="panel-quality" role="tabpanel">
      <div id="qualityContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-reviews" role="tabpanel">
      <div id="reviewsContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-releases" role="tabpanel">
      <div id="releasesContent"></div>
    </section>
    
    <section class="tab-panel" id="panel-evidence" role="tabpanel">
      <div id="evidenceContent"></div>
    </section>
    
    <div class="last-refresh" id="lastRefresh">Last refreshed: never</div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
