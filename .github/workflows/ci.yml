name: OpenChamber CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

permissions:
  contents: read

jobs:
  validate:
    name: Validate Extension
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify build output
        run: |
          if [ ! -f "panel/main.js" ]; then
            echo "ERROR: Built JS file not found"
            exit 1
          fi
          for page in panel/index.html panel/dashboard.html; do
            if ! grep -q 'src="main.js"' "$page"; then
              echo "ERROR: $page does not reference main.js"
              exit 1
            fi
          done
          echo "✅ Build output verified"

      - name: Validate extension manifest
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const oc = pkg.openchamber;
            if (!oc || oc.apiVersion !== 1) {
              console.error('ERROR: Invalid openchamber manifest');
              process.exit(1);
            }
            if (!oc.contributes?.panel?.entry || !oc.contributes?.page?.entry) {
              console.error('ERROR: Missing panel or page entry');
              process.exit(1);
            }
            if (!oc.contributes?.capabilities?.includes('files')) {
              console.error('ERROR: Missing files capability');
              console.error('capabilities:', oc.contributes?.capabilities);
              process.exit(1);
            }
            console.log('✅ Extension manifest valid');
          "

      - name: Check distribution files
        run: |
          # Ensure no sensitive files in dist
          if find panel -name "*.map" | grep -q .; then
            echo "WARNING: Source maps found in panel (consider excluding)"
          fi
          # Verify build produced required JS files (source .ts files are expected to exist)
          if [ ! -f "panel/main.js" ]; then
            echo "ERROR: Built JS files not found"
            exit 1
          fi
          echo "✅ Distribution files clean"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true