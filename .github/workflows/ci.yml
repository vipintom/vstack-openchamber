name: OpenChamber CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'panel/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  push:
    branches: [master]
    paths:
      - 'panel/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

permissions:
  contents: read

jobs:
  validate:
    name: Validate Extension
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain (pinned pnpm 9.x, Node 20, Bun)
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace gates (7 views + read-only)
        run: |
          # Gate 1: exactly 7 views in panel/src/types.ts, including Deliveries
          VIEW_COUNT=$(grep -c '{ id: "' panel/src/types.ts)
          if [ "$VIEW_COUNT" -ne 7 ]; then
            echo "ERROR: expected 7 views, found $VIEW_COUNT"
            exit 1
          fi
          grep -q '{ id: "deliveries", label: "Deliveries" }' panel/src/types.ts || {
            echo "ERROR: Deliveries view missing from panel/src/types.ts"
            exit 1
          }
          echo "OK: 7 views including Deliveries"
          # Gate 2: read-only — no write path, no network path.
          # NOTE: 'unlink(' with paren so the legitimate 'unlinked'
          # variable in panel/src/app.ts does not trip the gate.
          if grep -rnE 'unlink\(|postMessage|writeFile|appendFile|mkdirSync|fetch\(|WebSocket|XMLHttpRequest' panel/src panel/main.ts; then
            echo "ERROR: write/network API found — panel must stay read-only"
            exit 1
          fi
          echo "OK: read-only gate clean"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify build output
        run: |
          if [ ! -f "panel/main.js" ]; then
            echo "ERROR: Built JS file not found"
            exit 1
          fi
          for page in panel/index.html panel/dashboard.html; do
            if ! grep -q 'src="main.js"' "$page"; then
              echo "ERROR: $page does not reference main.js"
              exit 1
            fi
          done
          echo "✅ Build output verified"

      - name: Validate extension manifest
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const oc = pkg.openchamber;
            if (!oc || oc.apiVersion !== 1) {
              console.error('ERROR: Invalid openchamber manifest');
              process.exit(1);
            }
            if (!oc.contributes?.panel?.entry || !oc.contributes?.page?.entry) {
              console.error('ERROR: Missing panel or page entry');
              process.exit(1);
            }
            if (!oc.contributes?.capabilities?.includes('files')) {
              console.error('ERROR: Missing files capability');
              console.error('capabilities:', oc.contributes?.capabilities);
              process.exit(1);
            }
            console.log('✅ Extension manifest valid');
          "

      - name: Check distribution files
        run: |
          # Ensure no sensitive files in dist
          if find panel -name "*.map" | grep -q .; then
            echo "WARNING: Source maps found in panel (consider excluding)"
          fi
          # Verify build produced required JS files (source .ts files are expected to exist)
          if [ ! -f "panel/main.js" ]; then
            echo "ERROR: Built JS files not found"
            exit 1
          fi
          echo "✅ Distribution files clean"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
