name: OpenChamber Release

# NO NPM_TOKEN REQUIRED — OpenChamber distributes via Git URL or ZIP only
# REQUIRED: GITHUB_TOKEN (automatically provided)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    container: node:20-bookworm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup toolchain (pinned pnpm 9.x, Node 20, Bun)
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name || inputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Create distribution ZIP
        run: |
          # Explicit allowlist: only the two HTML shells, the single
          # built bundle (panel/main.js), plus metadata. No dashboard.js
          # bundle exists — do not add one.
          ZIP_NAME="vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip"
          zip -r "$ZIP_NAME" \
            panel/index.html \
            panel/dashboard.html \
            panel/main.js \
            package.json \
            README.md \
            LICENSE
          echo "Created $ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: Verify ZIP contents
        run: |
          ZIP_NAME="vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip"
          unzip -l "$ZIP_NAME"
          # Every allowlisted file must be present, no more no less
          for f in panel/index.html panel/dashboard.html panel/main.js package.json README.md LICENSE; do
            unzip -l "$ZIP_NAME" | grep -q "$f" || {
              echo "ERROR: $f missing from ZIP"
              exit 1
            }
          done
          # Stale dashboard.js bundle must NOT ship
          if unzip -l "$ZIP_NAME" | grep -q 'panel/dashboard\.js'; then
            echo "ERROR: stale panel/dashboard.js found in ZIP"
            exit 1
          fi
          echo "✅ ZIP contents verified"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip'

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "vstack-openchamber-${{ github.event.release.tag_name }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notes
        run: |
          echo "# vstack-openchamber ${{ github.event.release.tag_name || inputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "OpenChamber extension for vstack workflow visualization." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Installation" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Via OpenChamber Extension Manager (Recommended)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Settings → Extensions → Install from URL → \`https://github.com/vipintom/vstack-openchamber.git\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Manual (ZIP)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Download the ZIP from this release, then Settings → Extensions → Load Unpacked." >> RELEASE_NOTES.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
