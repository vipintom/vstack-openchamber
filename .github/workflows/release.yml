name: OpenChamber Release

# NO NPM_TOKEN REQUIRED — OpenChamber distributes via Git URL or ZIP only
# REQUIRED: GITHUB_TOKEN (automatically provided)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name || inputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Install zip
        run: apt-get update && apt-get install -y zip

      - name: Create distribution ZIP
        run: |
          # Create explicit allowlist for ZIP
          ZIP_NAME="vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip"
          zip -r "$ZIP_NAME" \
            panel/index.html \
            panel/dashboard.html \
            panel/main.js \
            panel/dashboard.js \
            package.json \
            README.md \
            LICENSE
          echo "Created $ZIP_NAME"
          ls -la "$ZIP_NAME"

      - name: Verify ZIP contents
        run: |
          unzip -l "vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip"
          # Verify required files present
          unzip -l "vstack-openchamber-${{ github.event.release.tag_name || inputs.version }}.zip" | grep -E "(panel/index\.html|panel/dashboard\.html|panel/main\.js|panel/dashboard\.js)" || {
            echo "ERROR: Required files missing from ZIP"
            exit 1
          }

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "vstack-openchamber-${{ github.event.release.tag_name }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notes
        run: |
          echo "# vstack-openchamber ${{ github.event.release.tag_name || inputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "OpenChamber extension for vstack workflow visualization." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Installation" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Via OpenChamber Extension Manager (Recommended)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Settings → Extensions → Install from URL → \`https://github.com/vipintom/vstack-openchamber.git\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Manual (ZIP)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Download the ZIP from this release, then Settings → Extensions → Load Unpacked." >> RELEASE_NOTES.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true